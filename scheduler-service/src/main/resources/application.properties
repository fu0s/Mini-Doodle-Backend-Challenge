spring.application.name=scheduler-service
server.port=8080

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doodle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doodle}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Cross-cutting Kafka settings shared with the consumer (see SharedKafkaProperties)
scheduling.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
scheduling.kafka.topic-name=${SCHEDULING_KAFKA_TOPIC_NAME:meeting-created}
scheduling.kafka.event-type=${SCHEDULING_KAFKA_EVENT_TYPE:CREATED}

# Scheduler-service specifics (see SchedulerProperties)
scheduling.scheduler.graphql-path=${GRAPHQL_PATH:/graphql}
scheduling.scheduler.producer.acks=${KAFKA_PRODUCER_ACKS:all}
scheduling.scheduler.producer.retries=${KAFKA_PRODUCER_RETRIES:3}
scheduling.scheduler.producer.linger-ms=${KAFKA_PRODUCER_LINGER_MS:5}

spring.graphql.path=${scheduling.scheduler.graphql-path}

graphql.graphiql.enabled=true