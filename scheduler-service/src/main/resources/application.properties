spring.application.name=scheduler-service
server.port=8080

management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://localhost:5432/doodle
spring.datasource.username=doodle
spring.datasource.password=doodle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cross-cutting Kafka settings shared with the consumer (see SharedKafkaProperties)
scheduling.kafka.bootstrap-servers=localhost:9092
scheduling.kafka.topic-name=meeting-created
scheduling.kafka.event-type=CREATED

# Scheduler-service specifics (see SchedulerProperties)
scheduling.scheduler.graphql-path=/graphql
scheduling.scheduler.producer.acks=all
scheduling.scheduler.producer.retries=3
scheduling.scheduler.producer.linger-ms=5

spring.graphql.path=${scheduling.scheduler.graphql-path}