spring.application.name=consumer-service
server.port=8081

management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://localhost:5432/doodle
spring.datasource.username=doodle
spring.datasource.password=doodle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cross-cutting Kafka settings shared with the scheduler (see SharedKafkaProperties)
scheduling.kafka.bootstrap-servers=localhost:9092
scheduling.kafka.topic-name=meeting-created
scheduling.kafka.event-type=CREATED

# Consumer-service specifics (see ConsumerProperties)
scheduling.consumer.group-id=consumer-service-meeting-created
scheduling.consumer.concurrency=3
scheduling.consumer.dlt-topic=meeting-created.DLT
scheduling.consumer.auto-offset-reset=earliest
scheduling.consumer.retry.interval-ms=0
scheduling.consumer.retry.max-attempts=0