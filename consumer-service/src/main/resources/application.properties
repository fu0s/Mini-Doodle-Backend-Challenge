spring.application.name=consumer-service
server.port=8081

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doodle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doodle}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Cross-cutting Kafka settings shared with the scheduler (see SharedKafkaProperties)
scheduling.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
scheduling.kafka.topic-name=${SCHEDULING_KAFKA_TOPIC_NAME:meeting-created}
scheduling.kafka.event-type=${SCHEDULING_KAFKA_EVENT_TYPE:CREATED}

# Consumer-service specifics (see ConsumerProperties)
scheduling.consumer.group-id=${CONSUMER_GROUP_ID:consumer-service-meeting-created}
scheduling.consumer.concurrency=${CONSUMER_CONCURRENCY:3}
scheduling.consumer.dlt-topic=${CONSUMER_DLT_TOPIC:meeting-created.DLT}
scheduling.consumer.auto-offset-reset=${CONSUMER_AUTO_OFFSET_RESET:earliest}
scheduling.consumer.retry.interval-ms=${CONSUMER_RETRY_INTERVAL_MS:0}
scheduling.consumer.retry.max-attempts=${CONSUMER_RETRY_MAX_ATTEMPTS:0}